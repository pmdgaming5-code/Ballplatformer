plugins { id 'com.android.application' }

android {
    namespace 'com.pmdgaming5.ballplatformer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pmdgaming5.ballplatformer'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
